<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">SoundKey — Your music. One keystroke away.</title>
  <desc id="desc">An illustrated keyboard and waveform on a soft lavender background. Native macOS and Windows applications.</desc>
