      <stop offset="1" stop-color="#6250C2"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#E7E0FC"/>
      <stop offset="1" stop-color="#EEE9FC" stop-opacity="0"/>
    </radialGradient>
  </defs>
